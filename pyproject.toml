[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cufy"
version = "0.1.0"
description = "A quantitative finance framework for option pricing and model calibration with GPU acceleration"
authors = [
    { name = "Timur", email = "karimullin.tr@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "torch>=2.10.0",
    "numpy>=2.4.3",
    "pydantic>=2.12.5",
    "psutil>=7.2.2",
    "optuna>=4.8.0",
]

[tool.hatchling.build.targets.wheel]
packages = ["cufy"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
